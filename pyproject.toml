[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "VOI buying-house portal, Estate commercial layer, and read-only Warden evidence bridge"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "plotly>=6.0.1",
    "streamlit>=1.44.0",
    "yfinance>=0.2.55",
]

[tool.setuptools]
py-modules = [
    "voi_evidence_adapter",
    "export_voi_inventory_evidence",
    "inventory_evidence_bridge",
    "estate_contract",
    "estate_registry",
    "estate_board",
]
