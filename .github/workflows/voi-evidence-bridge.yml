name: VOI Evidence Bridge CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv package manager
        run: python -m pip install --upgrade uv

      - name: Regenerate dependency lock
        run: uv lock

      - name: Commit regenerated lock only when changed
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Refresh VOI dependency lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install all locked project packages
        run: uv sync --locked

      - name: Compile bridge modules
        run: |
          uv run python -m py_compile \
            voi_evidence_adapter.py \
            export_voi_inventory_evidence.py \
            inventory_evidence_bridge.py \
            app.py

      - name: Run evidence contract regression suite
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prove direct test entrypoint
        run: uv run python tests/test_voi_evidence_adapter.py
