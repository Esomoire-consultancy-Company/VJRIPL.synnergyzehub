name: VOI Evidence Bridge CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install uv package manager
        run: python -m pip install --upgrade uv

      - name: Verify committed dependency lock
        run: uv lock --check

      - name: Install all locked project packages
        run: uv sync --locked

      - name: Compile bridge modules
        run: |
          uv run python -m py_compile \
            evidence_core.py \
            voi_evidence_adapter.py \
            export_voi_inventory_evidence.py \
            inventory_evidence_bridge.py \
            app.py

      - name: Run evidence contract regression suite
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prove direct test entrypoint
        run: uv run python tests/test_voi_evidence_adapter.py
